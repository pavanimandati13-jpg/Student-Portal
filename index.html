<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Result Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Registration & Result Portal</h1>
  </header>

  <section class="form-section">
    <form id="studentForm">
      <h2>Student Registration</h2>

      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required pattern="[A-Za-z ]+">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="course">Select Course:</label>
      <select id="course" name="course" required>
        <option value="">--Select--</option>
        <option value="BSc">B.Sc</option>
        <option value="BCA">BCA</option>
        <option value="BCom">B.Com</option>
      </select>

      <h3>Enter Marks</h3>
      <label for="subject1">HTML:</label>
      <input type="number" id="subject1" name="subject1" min="0" max="100" required>

      <label for="subject2">CSS:</label>
      <input type="number" id="subject2" name="subject2" min="0" max="100" required>

      <label for="subject3">JavaScript:</label>
      <input type="number" id="subject3" name="subject3" min="0" max="100" required>

      <button type="submit">Submit</button>
    </form>
  </section>

  <section id="resultSection" class="result-section hidden">
    <h2>Student Result</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Course</th>
          <th>HTML</th>
          <th>CSS</th>
          <th>JavaScript</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </section>

  <script>
    const form = document.getElementById('studentForm');
    const resultSection = document.getElementById('resultSection');
    const resultBody = document.getElementById('resultBody');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = form.name.value;
      const course = form.course.value;
      const html = parseInt(form.subject1.value);
      const css = parseInt(form.subject2.value);
      const js = parseInt(form.subject3.value);
      const total = html + css + js;

      resultBody.innerHTML = `
        <tr>
          <td>${name}</td>
          <td>${course}</td>
          <td>${html}</td>
          <td>${css}</td>
          <td>${js}</td>
          <td>${total}</td>
        </tr>
      `;
      resultSection.classList.remove('hidden');
      form.reset();
    });
  </script>
</body>
</html>
